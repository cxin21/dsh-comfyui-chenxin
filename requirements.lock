# Locked third-party dependencies for the ComfyUI Chenxin preset venv.
#
# Why this file exists: the six local packages (runtime/comfyui_http,
# runtime/comfyui_mcp, runtime/chenxin_runtime, skills/camera-image,
# skills/camera-video, skills/camera-multiview) declare *no upper bounds* on
# their PyPI dependencies. Without a lock, two machines set up a week apart get
# different httpx / huggingface_hub / tokenizers builds, and the workflow
# assets, the tokenizer behaviour and the MCP subprocess all silently drift.
#
# Scope: third-party packages only. The six local packages are installed from
# this source tree by scripts/install_local.py and are intentionally absent —
# their versions follow the checkout, not this file.
#
# Reference environment: Python 3.12.10 / Windows, captured 2026-11-22 from a
# venv that passes `--list-actions` on all three CLIs and completes a run.
#
# Updating: re-run `python -m pip freeze` in a venv you have actually exercised,
# diff it, and commit the result with a note on what changed and why. Pinning
# without a reason is how a lock rots into an unfixable museum.

