[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mcp-runtime"
version = "1.0.0"
description = "Shared stdio client for the upstream comfyui-mcp npm server"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["comfyui_mcp*"]
