[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-prompt-v1"
version = "3.0.0"
description = "Anima prompt authoring: policy, catalog grounding, composition, inspection."
requires-python = ">=3.10"
dependencies = [
    "chenxin-runtime",
]

[project.scripts]
anima-prompt-v1 = "anima_prompt_v1.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anima_prompt_v1*"]
exclude = ["agents*", "knowledge*", "references*", "tests*", "*.tests", "*.tests.*"]
