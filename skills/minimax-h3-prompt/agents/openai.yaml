name: minimax-h3-prompt
display_name: MiniMax H3 Prompt Authoring
description: >-
  Author model-native MiniMax H3 prompts for T2VA / I2VA / FL2VA / L2VA / Ref2VA.
  The model supplies a structured story and (for reference modes) ordered asset paths;
  the pipeline renders the official dialect, audits it against hard gates, and
  reports token + character accounting. Returns the executable English prompt plus
  a parallel Chinese skeleton.

version: 6.0.0
author: comfyui-chenxin preset
license: MIT

modes:
  - t2va
  - i2va
  - fl2va
  - l2va
  - ref2va

inputs:
  duration_seconds:
    type: number
    min: 4
    max: 15
    description: Target video duration in seconds.
    required: true
  shots:
    type: array
    description: Shot list with what / who / ambient / music / dialogue.
    required: true
  references:
    type: array
    description: |
      Ordered picture references. ref2va: exactly 1 or 3 entries with `who`
      required. i2va / fl2va / l2va: exactly 1 or 2 entries with `who` forbidden
      (keyframe labels are positional).
    required: false
  videos:
    type: array
    description: ref2va only. ≤ 3 entries, each 2-15 s. Combined ≤ 15 s.
    required: false
  audios:
    type: array
    description: ref2va only. ≤ 3 entries, each 2-15 s. Cannot be sole reference.
    required: false

cli_flags:
  stage:
    type: string
    enum: [t2va, i2va, fl2va, l2va, ref2va]
    description: Mode selector passed as `--stage <value>`, not inside the request payload.
    required: true

outputs:
  text:
    type: string
    description: Official English H3 prompt; copy verbatim into the model.
  text_zh:
    type: string
    description: Chinese skeleton; structural tokens translated, prose verbatim.
  text_zh_meta:
    type: object
    description: Translation metadata. quality = "skeleton"; prose_translated = false.
  findings:
    type: array
    description: Empty on success; populated with hard-failure messages.
  assumptions:
    type: array
    description: Pipeline-disclosed assumptions (e.g. default reference dimensions).
  budget:
    type: object
    description: Token + character accounting including `over` flag.
  mode:
    type: string
    description: Echo of the effective stage.
  stage:
    type: string
    description: Echo of the requested stage.

hard_failures:
  - code: h3_audit_failed
    when: findings non-empty
  - code: budget_exceeded
    when: budget.over == true
  - code: tokenizer_integrity_failed
    when: SHA-256 mismatch or schema drift in tokenizer snapshot
  - code: official_envelope_violated
    when: asset count or per-file size exceeds MiniMax H3 official limits

quality_caps:
  t2va: 1200
  i2va: 1500
  fl2va: 1700
  l2va: 1700
  ref2va: 2400
  character_limit: 7000
  context_window: 262144

references:
  official_capabilities: references/official-capabilities-and-routing.md
  t2va_rules: references/t2va-rules.md
  ref2va_rules: references/ref2va-rules.md
  keyframe_rules: references/keyframe-rules.md
  budget_policy: references/budget-policy.json

audit_gates:
  - stage is t2va / i2va / fl2va / l2va / ref2va
  - duration_seconds in [4, 15]
  - shot numbers sequential from 1
  - first shot has no timestamp; later shots At MM:SS.mmm within duration
  - every cut declares a model-native transition and new view or state
  - dialogue preserved byte-for-byte inside <d>[Language] ...</d>
  - soundscape free of dialogue and non-diegetic music
  - ref2va Picture / Subject labels resolve to ordered inputs
  - i2va / fl2va / l2va use the correct alignment preamble
  - text length does not exceed 7000 characters

canonical_authority: https://github.com/MiniMax-AI/MiniMax-H3/tree/main/skills/h3-prompt-writing